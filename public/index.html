<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliothèque en Ligne</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ---------- VARIABLES & BASE ---------- */
    :root {
      --electric-blue: #00d4ff;
      --electric-purple: #8b5cf6;
      --electric-pink: #f472b6;
      --electric-green: #10b981;
      --electric-orange: #f97316;
      --dark-bg: #0a0a1a;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-primary: #ffffff;
      --text-secondary: #a8b2d1;
      --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.3);
      --gradient-electric: linear-gradient(135deg, var(--electric-blue), var(--electric-purple));
      --gradient-card: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--dark-bg);
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, transparent 50%, rgba(0, 212, 255, 0.02) 50%),
        linear-gradient(0deg, transparent 50%, rgba(139, 92, 246, 0.02) 50%);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: -1;
      animation: grid-move 30s linear infinite;
    }

    @keyframes grid-move {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    /* ---------- CONTAINER & LAYOUT ---------- */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
    }

    /* ---------- HEADER ---------- */
    .header-section {
      text-align: center;
      padding: 2rem 0;
      margin-bottom: 2rem;
      position: relative;
    }

    .header-section::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: var(--gradient-electric);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    h1 {
      background: var(--gradient-electric);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      position: relative;
      animation: glow-pulse 4s ease-in-out infinite alternate;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-top: 0.5rem;
    }

    @keyframes glow-pulse {
      0% { filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.3)); }
      100% { filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.6)); }
    }

    /* ---------- CONTROLS SECTION ---------- */
    .controls-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-container {
      position: relative;
      flex: 1;
      min-width: 300px;
    }

    .search-container i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      z-index: 2;
    }

    #recherche {
      padding-left: 45px !important;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 15px;
      height: 50px;
      font-size: 1rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    #recherche:focus {
      border-color: var(--electric-blue);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1), 0 0 20px rgba(0, 212, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
    }

    /* ---------- BOUTONS ---------- */
    .btn {
      padding: 12px 28px;
      font-weight: 600;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 50px;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: var(--gradient-electric);
      color: white;
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 20px 40px rgba(0, 212, 255, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--electric-green), #059669);
      color: white;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
    }

    .btn-success:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #374151, #1f2937);
      color: var(--text-primary);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .btn-secondary:hover {
      transform: translateY(-3px) scale(1.05);
      background: linear-gradient(135deg, #4b5563, #374151);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    /* ---------- STATS BAR ---------- */
    .stats-bar {
      background: var(--gradient-card);
      border: 1px solid var(--card-border);
      border-radius: 15px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--gradient-electric);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ---------- COLONNES ---------- */
    .columns-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .column-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
      padding: 0 5px;
    }

    .column-header i {
      font-size: 1.3rem;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--gradient-electric);
      color: white;
    }

    .column-header h3 {
      color: var(--text-primary);
      font-weight: 700;
      font-size: 1.4rem;
      margin: 0;
    }

    .column-count {
      margin-left: auto;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .book-column {
      background: var(--gradient-card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.5rem;
      min-height: 450px;
      backdrop-filter: blur(15px);
      position: relative;
      transition: all 0.3s ease;
    }

    .book-column::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(45deg, var(--electric-blue), var(--electric-purple), var(--electric-pink));
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: xor;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .book-column:hover::before {
      opacity: 0.3;
    }

    .book-column:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .book-column.dragover {
      background: linear-gradient(145deg, rgba(0, 212, 255, 0.1), rgba(139, 92, 246, 0.1));
      border: 2px dashed var(--electric-blue);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
      animation: pulse-dragover 1s ease-in-out infinite;
    }

    @keyframes pulse-dragover {
      0%, 100% { transform: translateY(-5px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    /* ---------- CARTES DE LIVRES ---------- */
    .book-card {
      background: var(--gradient-card);
      border: 1px solid var(--card-border);
      border-radius: 15px;
      padding: 1.2rem;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .book-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
      transition: left 0.6s ease;
    }

    .book-card:hover::before {
      left: 100%;
    }

    .book-card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--electric-blue);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.3),
        0 0 25px rgba(0, 212, 255, 0.2);
    }

    .book-card .book-title {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .book-card .book-author {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .book-rating {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .stars {
      display: flex;
      gap: 2px;
    }

    .stars i {
      color: #fbbf24;
      font-size: 0.8rem;
    }

    .rating-text {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    /* ---------- FORMS & INPUTS ---------- */
    .form-control, .form-select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: var(--electric-blue);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1), 0 0 20px rgba(0, 212, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
    }

    .form-control::placeholder {
      color: var(--text-secondary);
    }

    .form-label {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      display: block;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    /* ---------- MODALES ---------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1050;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .custom-modal-content {
      background: var(--gradient-card);
      border: 1px solid var(--card-border);
      padding: 2.5rem;
      border-radius: 25px;
      width: 100%;
      max-width: 650px;
      backdrop-filter: blur(20px);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 50px rgba(0, 212, 255, 0.1);
      overflow-y: auto;
      max-height: 90vh;
      position: relative;
      animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from { 
        opacity: 0; 
        transform: translateY(50px) scale(0.95); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      }
    }

    .custom-modal-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 25px;
      padding: 1px;
      background: linear-gradient(45deg, var(--electric-blue), var(--electric-purple));
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: xor;
      opacity: 0.2;
    }

    .custom-modal-content h5 {
      margin-bottom: 2rem;
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--gradient-electric);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* Modal Bootstrap */
    .modal-content {
      background: var(--gradient-card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
    }

    .modal-header {
      background: var(--gradient-electric);
      color: white;
      border-bottom: 1px solid var(--card-border);
      border-radius: 20px 20px 0 0;
      padding: 1.5rem;
    }

    .modal-title {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-body {
      color: var(--text-primary);
      padding: 2rem;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
      
      .columns-container {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .controls-section {
        flex-direction: column;
        align-items: stretch;
      }
      
      .search-container {
        min-width: unset;
      }
      
      .stats-bar {
        flex-direction: column;
        gap: 1rem;
      }
      
      .custom-modal-content {
        padding: 1.5rem;
        margin: 1rem;
      }
    }

    @media (max-width: 576px) {
      .custom-modal-content {
        padding: 1rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .book-column {
        min-height: 300px;
      }
    }

    /* ---------- ANIMATIONS ---------- */
    .fade-in {
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading-shimmer {
      background: linear-gradient(90deg, var(--card-bg) 25%, rgba(255,255,255,0.1) 50%, var(--card-bg) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body>
  <div class="container my-5 fade-in">
    <!-- Header Section -->
    <div class="header-section">
      <h1><i class="fas fa-book-open" style="color: var(--electric-blue); margin-right: 15px;"></i>Ma Bibliothèque</h1>
      <p class="subtitle">Organisez et découvrez vos lectures favorites</p>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-number" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="stat-a-lire">0</div>
        <div class="stat-label">À lire</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="stat-en-cours">0</div>
        <div class="stat-label">En cours</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="stat-lu">0</div>
        <div class="stat-label">Terminés</div>
      </div>
    </div>

    <!-- Controls Section -->
    <div class="controls-section">
      <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="recherche" class="form-control" placeholder="Rechercher un livre par titre ou auteur...">
      </div>
      <button id="ouvrir-modal-ajout" class="btn btn-primary">
        <i class="fas fa-plus"></i>
        Ajouter un livre
      </button>
    </div>

    <!-- Colonnes de livres -->
    <div class="columns-container">
      <div>
        <div class="column-header">
          <i class="fas fa-bookmark"></i>
          <h3>À lire</h3>
          <span class="column-count" id="count-a-lire">0</span>
        </div>
        <div id="a-lire" class="book-column">
          <div class="empty-state">
            <i class="fas fa-bookmark"></i>
            <p>Aucun livre à lire</p>
          </div>
        </div>
      </div>
      
      <div>
        <div class="column-header">
          <i class="fas fa-book-reader"></i>
          <h3>En cours</h3>
          <span class="column-count" id="count-en-cours">0</span>
        </div>
        <div id="en-cours" class="book-column">
          <div class="empty-state">
            <i class="fas fa-book-reader"></i>
            <p>Aucune lecture en cours</p>
          </div>
        </div>
      </div>
      
      <div>
        <div class="column-header">
          <i class="fas fa-check-circle"></i>
          <h3>Terminés</h3>
          <span class="column-count" id="count-lu">0</span>
        </div>
        <div id="lu" class="book-column">
          <div class="empty-state">
            <i class="fas fa-check-circle"></i>
            <p>Aucun livre terminé</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modale d'ajout personnalisée -->
  <div id="modal-ajout" class="modal-overlay">
    <div class="custom-modal-content">
      <h5><i class="fas fa-plus-circle"></i>Ajouter un nouveau livre</h5>
      <form id="form-ajout-livre">
        <div class="row">
          <div class="col-md-8 mb-3">
            <label for="titre" class="form-label">Titre *</label>
            <input type="text" class="form-control" id="titre" required>
          </div>
          <div class="col-md-4 mb-3">
            <label for="pages" class="form-label">Pages</label>
            <input type="number" class="form-control" id="pages" min="1">
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="auteur" class="form-label">Auteur *</label>
            <input type="text" class="form-control" id="auteur" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="editeur" class="form-label">Éditeur</label>
            <input type="text" class="form-control" id="editeur">
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-8 mb-3">
            <label for="sousTitre" class="form-label">Sous-titre</label>
            <input type="text" class="form-control" id="sousTitre">
          </div>
          <div class="col-md-4 mb-3">
            <label for="published" class="form-label">Date de publication</label>
            <input type="date" class="form-control" id="published">
          </div>
        </div>
        
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="4" placeholder="Résumé ou description du livre..."></textarea>
        </div>
        
        <div class="mb-4">
          <label for="lien" class="form-label">Lien (site officiel)</label>
          <input type="url" class="form-control" id="lien" placeholder="https://...">
        </div>
        
        <div class="text-end">
          <button type="submit" class="btn btn-success">
            <i class="fas fa-save"></i>
            Ajouter le livre
          </button>
          <button type="button" class="btn btn-secondary" id="fermer-modal-ajout">
            <i class="fas fa-times"></i>
            Annuler
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modale de détails de livre Bootstrap -->
  <div class="modal fade" id="livreModal" tabindex="-1" aria-labelledby="livreModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="livreModalLabel">
            <i class="fas fa-info-circle"></i>
            Détails du livre
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="contenuModal">
          <!-- contenu injecté dynamiquement -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // JavaScript pour la modale personnalisée
    document.addEventListener("DOMContentLoaded", () => {
      const btnOuvrir = document.getElementById("ouvrir-modal-ajout");
      const btnFermer = document.getElementById("fermer-modal-ajout");
      const modal = document.getElementById("modal-ajout");

      btnOuvrir.addEventListener("click", () => {
        modal.style.display = "flex";
      });

      btnFermer.addEventListener("click", () => {
        modal.style.display = "none";
      });

      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });
    });

    // JavaScript principal de l'application (repris du code existant avec améliorations UI)
    document.addEventListener("DOMContentLoaded", async () => {
      let livresApi = [];
      let livresLocaux = [];
      let livres = [];

      // Fonction pour mettre à jour les statistiques
      const updateStats = () => {
        const aLire = livres.filter(l => l.colonne === 'a-lire').length;
        const enCours = livres.filter(l => l.colonne === 'en-cours').length;
        const lu = livres.filter(l => l.colonne === 'lu').length;
        
        document.getElementById('stat-total').textContent = livres.length;
        document.getElementById('stat-a-lire').textContent = aLire;
        document.getElementById('stat-en-cours').textContent = enCours;
        document.getElementById('stat-lu').textContent = lu;
        
        document.getElementById('count-a-lire').textContent = aLire;
        document.getElementById('count-en-cours').textContent = enCours;
        document.getElementById('count-lu').textContent = lu;
      };

      // Fonction pour créer les étoiles de notation
      const createStars = (note) => {
        if (!note) return '';
        let stars = '';
        for (let i = 1; i <= 5; i++) {
          stars += `<i class="fas fa-star ${i <= note ? '' : 'text-muted'}" style="opacity: ${i <= note ? 1 : 0.3}"></i>`;
        }
        return stars;
      };

      const createCard = (livre) => {
        const carte = document.createElement("div");
        carte.className = "book-card mb-2 p-2 border rounded";
        
        // Amélioration du contenu de la carte
        const starsHtml = livre.note ? `
          <div class="book-rating">
            <div class="stars">${createStars(livre.note)}</div>
            <span class="rating-text">(${livre.note}/5)</span>
          </div>
        ` : '';
        
        carte.innerHTML = `
          <div class="book-title">${livre.title}</div>
          <div class="book-author">par ${livre.author || "Auteur inconnu"}</div>
          ${starsHtml}
        `;
        
        carte.setAttribute("draggable", "true");
        carte.dataset.isbn = livre.isbn;

        carte.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", livre.isbn);
          carte.style.opacity = "0.5";
        });

        carte.addEventListener("dragend", (e) => {
          carte.style.opacity = "1";
        });

        carte.addEventListener("click", () => {
          const noteOptions = [1, 2, 3, 4, 5]
            .map((n) => `<option value="${n}" ${livre.note == n ? "selected" : ""}>${n}</option>`)
            .join("");

          const contenu = `
            <div class="row">
              <div class="col-md-8">
                <h4 style="color: var(--electric-blue); margin-bottom: 1rem;">${livre.title}</h4>
                <p><strong>Auteur :</strong> ${livre.author || "Inconnu"}</p>
                ${livre.subtitle ? `<p><strong>Sous-titre :</strong> ${livre.subtitle}</p>` : ""}
                <p><strong>Pages :</strong> ${livre.pages || "Non spécifié"}</p>
                <p><strong>Publié le :</strong> ${livre.published ? new Date(livre.published).toLocaleDateString() : "Non spécifié"}</p>
                <p><strong>Éditeur :</strong> ${livre.publisher || "Non spécifié"}</p>
                ${livre.website ? `<p><a href="${livre.website}" target="_blank" style="color: var(--electric-blue);"><i class="fas fa-external-link-alt"></i> Voir le site officiel</a></p>` : ""}
              </div>
              <div class="col-md-4">
                <div style="background: var(--gradient-card); padding: 1rem; border-radius: 12px; border: 1px solid var(--card-border);">
                  <h6 style="color: var(--text-primary); margin-bottom: 0.5rem;">Statut actuel</h6>
                  <span class="badge" style="background: var(--gradient-electric); padding: 0.5rem 1rem;">${livre.colonne === 'a-lire' ? 'À lire' : livre.colonne === 'en-cours' ? 'En cours' : 'Terminé'}</span>
                  ${livre.note ? `
                    <div style="margin-top: 1rem;">
                      <h6 style="color: var(--text-primary); margin-bottom: 0.5rem;">Note</h6>
                      <div class="stars">${createStars(livre.note)}</div>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
            
            ${livre.description ? `
              <div style="margin: 1.5rem 0;">
                <h6 style="color: var(--text-primary);">Description</h6>
                <p style="color: var(--text-secondary); line-height: 1.6;">${livre.description}</p>
              </div>
            ` : ''}

            <hr style="border-color: var(--card-border); margin: 2rem 0;">
            
            <form id="form-note-${livre.isbn}">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="note-${livre.isbn}" class="form-label"><strong>Note (1 à 5)</strong></label>
                  <select id="note-${livre.isbn}" class="form-select">${noteOptions}</select>
                </div>
              </div>
              <div class="mb-3">
                <label for="commentaire-${livre.isbn}" class="form-label"><strong>Commentaire</strong></label>
                <textarea id="commentaire-${livre.isbn}" class="form-control" rows="3" placeholder="Vos impressions sur ce livre...">${livre.commentaire || ""}</textarea>
              </div>
              <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i>
                Enregistrer
              </button>
            </form>
          `;

          document.getElementById("contenuModal").innerHTML = contenu;
          const modal = new bootstrap.Modal(document.getElementById("livreModal"));
          modal.show();

          document.getElementById(`form-note-${livre.isbn}`).addEventListener("submit", async (e) => {
            e.preventDefault();
            const nouvelleNote = parseInt(document.getElementById(`note-${livre.isbn}`).value);
            const nouveauCommentaire = document.getElementById(`commentaire-${livre.isbn}`).value;

            livresLocaux = livresLocaux.map((l) =>
              l.isbn === livre.isbn ? { ...l, note: nouvelleNote, commentaire: nouveauCommentaire } : l
            );

            try {
              await fetch("/api/livres", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(livresLocaux.find((l) => l.isbn === livre.isbn)),
              });
              
              updateAffichage();
              modal.hide();
              
              // Notification de succès
              showNotification("Livre mis à jour avec succès !", "success");
            } catch (error) {
              showNotification("Erreur lors de la mise à jour", "error");
            }
          });
        });

        return carte;
      };

      // Fonction pour afficher une notification
      const showNotification = (message, type = "info") => {
        const notification = document.createElement("div");
        notification.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          padding: 1rem 1.5rem;
          border-radius: 12px;
          color: white;
          font-weight: 600;
          z-index: 2000;
          animation: slideInRight 0.3s ease;
          background: ${type === 'success' ? 'var(--electric-green)' : type === 'error' ? '#ef4444' : 'var(--electric-blue)'};
          box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        `;
        notification.innerHTML = `<i class="fas fa-${type === 'success' ? 'check' : type === 'error' ? 'exclamation-triangle' : 'info'}-circle"></i> ${message}`;
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.style.animation = "slideOutRight 0.3s ease";
          setTimeout(() => notification.remove(), 300);
        }, 3000);
      };

      const afficherLivres = (livres) => {
        document.querySelectorAll(".book-column").forEach((col) => {
          // Garder seulement les empty-state
          const emptyState = col.querySelector('.empty-state');
          col.innerHTML = "";
          if (emptyState) col.appendChild(emptyState);
        });
        
        livres.forEach((livre) => {
          const colonne = document.getElementById(livre.colonne || "a-lire");
          const carte = createCard(livre);
          
          // Cacher l'empty-state s'il y a des livres
          const emptyState = colonne.querySelector('.empty-state');
          if (emptyState) emptyState.style.display = 'none';
          
          colonne?.appendChild(carte);
        });
        
        // Afficher l'empty-state pour les colonnes vides
        document.querySelectorAll(".book-column").forEach((col) => {
          const cards = col.querySelectorAll('.book-card');
          const emptyState = col.querySelector('.empty-state');
          if (emptyState) {
            emptyState.style.display = cards.length === 0 ? 'block' : 'none';
          }
        });
        
        updateStats();
      };

      const updateAffichage = () => {
        const isbnLocaux = new Set(livresLocaux.map((l) => l.isbn));
        livres = [
          ...livresLocaux,
          ...livresApi.filter((l) => !isbnLocaux.has(l.isbn))
        ];
        afficherLivres(livres);
      };

      // Chargement des données
      try {
        const resApi = await fetch("https://keligmartin.github.io/api/books.json");
        const dataApi = await resApi.json();
        livresApi = dataApi.map((livre) => ({
          ...livre,
          colonne: livre.colonne || "a-lire",
          note: livre.note ?? null,
          commentaire: livre.commentaire ?? "",
        }));
      } catch (err) {
        console.error("Erreur API distante :", err);
        showNotification("Impossible de charger les livres distants", "error");
      }

      try {
        const resLocal = await fetch("/api/livres");
        livresLocaux = await resLocal.json();
      } catch (err) {
        console.error("Erreur API locale :", err);
        livresLocaux = [];
      }

      updateAffichage();

      // Formulaire d'ajout de livre
      document.getElementById("form-ajout-livre").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const titre = document.getElementById("titre").value.trim();
        const auteur = document.getElementById("auteur").value.trim();
        
        if (!titre || !auteur) {
          showNotification("Le titre et l'auteur sont obligatoires", "error");
          return;
        }

        const nouveauLivre = {
          isbn: "manuel-" + Date.now(),
          title: titre,
          author: auteur,
          subtitle: document.getElementById("sousTitre").value.trim() || null,
          pages: parseInt(document.getElementById("pages").value) || null,
          published: document.getElementById("published").value || null,
          publisher: document.getElementById("editeur").value.trim() || null,
          description: document.getElementById("description").value.trim() || "",
          website: document.getElementById("lien").value.trim() || null,
          colonne: "a-lire",
          note: null,
          commentaire: "",
        };

        try {
          const res = await fetch("/api/livres", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(nouveauLivre),
          });

          if (res.ok) {
            const livreAjoute = await res.json();
            livresLocaux.push(livreAjoute);
            updateAffichage();
            e.target.reset();
            document.getElementById("modal-ajout").style.display = "none";
            showNotification("Livre ajouté avec succès !", "success");
          } else {
            showNotification("Erreur lors de l'ajout du livre", "error");
          }
        } catch (error) {
          showNotification("Erreur de connexion au serveur", "error");
        }
      });

      // Drag & Drop
      document.querySelectorAll(".book-column").forEach((col) => {
        col.addEventListener("dragover", (e) => {
          e.preventDefault();
          col.classList.add("dragover");
        });

        col.addEventListener("dragleave", (e) => {
          if (!col.contains(e.relatedTarget)) {
            col.classList.remove("dragover");
          }
        });

        col.addEventListener("drop", async (e) => {
          e.preventDefault();
          col.classList.remove("dragover");
          
          const isbn = e.dataTransfer.getData("text/plain");
          const carte = document.querySelector(`.book-card[data-isbn='${isbn}']`);
          
          // Cacher l'empty-state
          const emptyState = col.querySelector('.empty-state');
          if (emptyState) emptyState.style.display = 'none';
          
          col.appendChild(carte);

          let livre = livres.find((l) => l.isbn === isbn);
          if (!livre) return;

          const existeDansLocaux = livresLocaux.some((l) => l.isbn === isbn);

          if (!existeDansLocaux) {
            livre = { ...livre, colonne: col.id };
            livresLocaux.push(livre);
          } else {
            livresLocaux = livresLocaux.map((l) =>
              l.isbn === isbn ? { ...l, colonne: col.id } : l
            );
            livre = livresLocaux.find((l) => l.isbn === isbn);
          }

          try {
            await fetch("/api/livres", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(livre),
            });

            updateAffichage();
            showNotification(`Livre déplacé vers "${col.id === 'a-lire' ? 'À lire' : col.id === 'en-cours' ? 'En cours' : 'Terminé'}"`, "success");
          } catch (error) {
            showNotification("Erreur lors du déplacement", "error");
          }
        });
      });

      // Recherche améliorée
      const inputRecherche = document.getElementById("recherche");
      inputRecherche?.addEventListener("input", () => {
        const terme = inputRecherche.value.toLowerCase();
        document.querySelectorAll(".book-card").forEach((carte) => {
          const isbn = carte.dataset.isbn;
          const livre = livres.find((l) => l.isbn === isbn);
          const titre = (livre?.title || "").toLowerCase();
          const auteur = (livre?.author || "").toLowerCase();
          const match = titre.includes(terme) || auteur.includes(terme);
          
          carte.style.display = match ? "block" : "none";
          
          // Animation de highlight
          if (match && terme.length > 0) {
            carte.style.animation = "none";
            setTimeout(() => carte.style.animation = "fadeInUp 0.3s ease", 10);
          }
        });
        
        // Gérer l'affichage des empty-states lors de la recherche
        document.querySelectorAll(".book-column").forEach((col) => {
          const visibleCards = Array.from(col.querySelectorAll('.book-card')).filter(c => c.style.display !== 'none');
          const emptyState = col.querySelector('.empty-state');
          if (emptyState) {
            emptyState.style.display = visibleCards.length === 0 ? 'block' : 'none';
          }
        });
      });

      // Animation d'entrée pour les statistiques
      setTimeout(() => {
        document.querySelectorAll('.stat-number').forEach((el, i) => {
          setTimeout(() => {
            el.style.animation = 'fadeInUp 0.6s ease';
          }, i * 100);
        });
      }, 500);
    });

    // Styles d'animation supplémentaires
    const additionalStyles = document.createElement('style');
    additionalStyles.textContent = `
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes slideOutRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
    `;
    document.head.appendChild(additionalStyles);
  </script>
</body>
</html>
