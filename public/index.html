<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque en Ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 Ma Bibliothèque en Ligne</h1>
    </header>

    <div class="container">
        <!-- Zone de messages -->
        <div id="messageArea"></div>

        <!-- Actions principales -->
        <div class="actions">
            <button class="btn btn-primary" onclick="showAddBookModal()">
                ➕ Ajouter un livre
            </button>
            <button class="btn btn-secondary" onclick="showColumnSettingsModal()">
                ⚙️ Personnaliser les colonnes
            </button>
        </div>

        <!-- Colonnes de livres -->
        <div class="columns-container" id="columnsContainer">
            <!-- Les colonnes seront générées dynamiquement -->
        </div>
    </div>

    <!-- Modal pour ajouter/éditer un livre -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="bookModalTitle">Ajouter un livre</h2>
                <span class="close-btn" onclick="closeModal('bookModal')">&times;</span>
            </div>
            <form id="bookForm" onsubmit="handleBookSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="bookTitle">Titre *</label>
                    <input type="text" class="form-input" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="bookAuthor">Auteur *</label>
                    <input type="text" class="form-input" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="bookISBN">ISBN</label>
                    <input type="text" class="form-input" id="bookISBN">
                </div>
                <div class="form-group">
                    <label class="form-label" for="bookColumn">Colonne</label>
                    <select class="form-select" id="bookColumn">
                        <!-- Options générées dynamiquement -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="bookRating">Note (0-5)</label>
                    <input type="number" class="form-input" id="bookRating" min="0" max="5" step="0.5">
                </div>
                <div class="form-group">
                    <label class="form-label" for="bookComment">Commentaire</label>
                    <textarea class="form-textarea" id="bookComment"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Enregistrer
                </button>
            </form>
        </div>
    </div>

    <!-- Modal pour les détails d'un livre -->
    <div class="modal" id="bookDetailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="bookDetailsTitle">Détails du livre</h2>
                <span class="close-btn" onclick="closeModal('bookDetailsModal')">&times;</span>
            </div>
            <div id="bookDetailsContent">
                <!-- Contenu généré dynamiquement -->
            </div>
        </div>
    </div>

    <!-- Modal pour personnaliser les colonnes -->
    <div class="modal" id="columnSettingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Personnaliser les colonnes</h2>
                <span class="close-btn" onclick="closeModal('columnSettingsModal')">&times;</span>
            </div>
            <div id="columnsList">
                <!-- Liste des colonnes générée dynamiquement -->
            </div>
            <button class="btn btn-primary" onclick="addNewColumn()" style="margin-top: 1rem;">
                ➕ Ajouter une colonne
            </button>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
